[program:wowdash]
command=/home/Wow-dash/venv/bin/gunicorn WowDash.wsgi:application --workers 3 --bind 127.0.0.1:8000 --timeout 120 --keep-alive 5 --max-requests 1000 --max-requests-jitter 50
directory=/home/Wow-dash
user=wowdash
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
environment=DJANGO_SETTINGS_MODULE="WowDash.settings_production",PYTHONUNBUFFERED="1"
stdout_logfile=/var/log/wowdash/gunicorn.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:wowdash-bots]
command=/home/Wow-dash/venv/bin/python manage.py run_bots
directory=/home/Wow-dash
user=wowdash
