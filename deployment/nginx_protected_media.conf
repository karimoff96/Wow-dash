# Include inside the multilang.uz server block. This location must never be public.
location /protected-media/ {
    internal;
    alias /home/Wow-dash/media/;
}

# Place these before any general /media/ alias. Customer order documents and
# receipts must only be served after Django returns an X-Accel-Redirect.
location ^~ /media/order_media/ { return 404; }
location ^~ /media/recipts/ { return 404; }
location ^~ /media/receipts/ { return 404; }
